[settings]
env_shell_expand = true

[tools]
neovim = "stable"
go = "1.26.2"
node = "24.9.0"
rust = "1.95.0"
python = "3.14.4"
"aqua:expert-lsp/expert" = "latest"
fzf = "latest"
lsd = "latest"
typstyle = "latest"
yarn = "latest"
tree-sitter = "latest"
# snacks.nvim (picker)
ripgrep = "latest"
# snacks.nvim (lazygit)
lazygit = "latest"
# snacks.nvim (picker)
fd = "latest"


[env]
# config paths
VALE_CONFIG_PATH = "{{ get_env(name='HOME', default=env.USERPROFILE) }}/dotfiles/vale/vale.ini"
WEZTERM_CONFIG_FILE = "{{ get_env(name='HOME', default=env.USERPROFILE) }}/dotfiles/wezterm/wezterm.lua"
# keep elixir iex history
ERL_AFLAGS = "-kernel shell_history enabled"

[tools]
# -- package managers (node)
pnpm = "latest"
# used by mise
aube = "latest"
# used by Neovim plugin
"npm:@yarnpkg/cli-dist" = "latest"

# -- package managers (python)
uv = "latest"

# -- programming languages
go = "1"
node = "lts"
bun = "latest"
rust = "1"
python = "3"

# -- terminal tools
oh-my-posh = "latest"
opencode = "latest"
"aqua:earendil-works/pi" = "latest"
fzf = "latest"
lsd = "latest"
# AI tool + snacks.nvim (picker)
ripgrep = "latest"

# -- neovim tools
neovim = "stable"
tree-sitter = "latest"
typstyle = "latest"
# elixir LSP
"aqua:expert-lsp/expert" = "latest"
# snacks.nvim (lazygit)
lazygit = "latest"
# snacks.nvim (picker)
fd = "latest"
"github:chojs23/ec" = "latest"

# -- AI skills / tools
"npm:skills" = "latest"
"npm:ccusage" = "latest"
"npm:caveman-shrink" = "latest"
"npm:@everruns/bashkit" = "latest"
"github:modem-dev/hunk" = "latest"
delta = "latest"
"pipx:serena-agent" = { version = "latest", uvx_args = "--python 3.13", postinstall = "serena init" }

[env]
{{ if .isPersonal }}
MISE_GITHUB_TOKEN = "{{ keepassxcAttribute "GitHub" "PAT_CRAWL_REPOS" }}"
CONTEXT7_API_KEY = "{{ keepassxcAttribute "Context7" "API key" }}"
{{- end }}
XDG_CONFIG_HOME = "{{ .chezmoi.homeDir }}/.config"
PI_CODING_AGENT_DIR = "{{ .chezmoi.homeDir }}/.config/pi/agent"
PI_AGENT_DIR = "{{ .chezmoi.homeDir }}/.config/pi/"
PI_OFFLINE = 1
CC_SAFETY_NET_STRICT = 1
CC_SAFETY_NET_WORKTREE = 1
# keep elixir iex history
ERL_AFLAGS = "-kernel shell_history enabled"
